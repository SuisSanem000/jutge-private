name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install pedit dependencies (if present)
        run: |
          if [ -f "projects/02/problem-editor/pedit/package.json" ]; then
            bun install --cwd projects/02/problem-editor/pedit
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/02/pedit-cli-and-pdf-viewer/cli _site/02/pedit-cli-and-pdf-viewer/pdf-viewer

          # Phase 02 hub (only two links: cli/ and pdf-viewer/) + CLI page
          cp projects/02/pages/index.html _site/02/pedit-cli-and-pdf-viewer/index.html
          cp projects/02/pages/cli/index.html _site/02/pedit-cli-and-pdf-viewer/cli/index.html

          # Package pedit CLI bundle if present
          if [ -d "projects/02/problem-editor/pedit" ]; then
            tar --exclude='node_modules' --exclude='.env*' -czf _site/02/pedit-cli-and-pdf-viewer/cli/pedit.tar.gz -C projects/02/problem-editor pedit
          fi

          # Export PDF viewer if present, else write a clean status page
          if [ -f "projects/02/problem-editor/viewer/export-static.ts" ]; then
            bun run projects/02/problem-editor/viewer/export-static.ts _site/02/pedit-cli-and-pdf-viewer/pdf-viewer
          else
            cat > _site/02/pedit-cli-and-pdf-viewer/pdf-viewer/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8" /><title>PDF Problem Viewer</title></head>
          <body style="font-family:system-ui,sans-serif;max-width:680px;margin:3rem auto;padding:0 1rem;line-height:1.6;">
            <p><a href="../">&larr; Back to 02</a></p>
            <h1>PDF Problem Viewer</h1>
            <p><code>projects/02/problem-editor/</code> is currently kept local-only (gitignored) pending supervisor confirmation on public sharing.</p>
          </body>
          </html>
          HTML
          fi

          # Root index pointing to latest phase
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Jutge Workspace — Live Demos</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #111; }
              a { color: #0969da; text-decoration: none; font-weight: 600; }
              a:hover { text-decoration: underline; }
              ul { padding-left: 1.25rem; }
            </style>
          </head>
          <body>
            <h1>Jutge Workspace — Live Pages</h1>
            <ul>
              <li><a href="./02/pedit-cli-and-pdf-viewer/">02 — pedit CLI &amp; PDF Problem Viewer</a></li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
