name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site/02/pedit-cli-and-pdf-viewer

          # Phase 02 static pages (hub, cli, pdf-viewer)
          cp -r projects/02/pages/* _site/02/pedit-cli-and-pdf-viewer/

          # Package pedit CLI if present
          if [ -d "projects/02/problem-editor/pedit" ]; then
            tar -czf _site/02/pedit-cli-and-pdf-viewer/cli/pedit.tar.gz -C projects/02/problem-editor pedit
          fi

          # Copy sample PDFs for live static preview
          mkdir -p _site/02/pedit-cli-and-pdf-viewer/pdf-viewer/samples
          if [ -d "projects/02/problem-editor/generated-exam-sample" ]; then
            cp projects/02/problem-editor/generated-exam-sample/*.pdf _site/02/pedit-cli-and-pdf-viewer/pdf-viewer/samples/ || true
          fi

          # Root index pointing to latest phase
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Jutge Workspace — Live Demos</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #111; }
              a { color: #0969da; text-decoration: none; font-weight: 600; }
              a:hover { text-decoration: underline; }
              ul { padding-left: 1.25rem; }
            </style>
          </head>
          <body>
            <h1>Jutge Workspace — Live Pages</h1>
            <ul>
              <li><a href="./02/pedit-cli-and-pdf-viewer/">02 — pedit CLI &amp; PDF Problem Viewer</a></li>
            </ul>
          </body>
          </html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
