
type: Matching

text: Aparelleu les expressions amb els tipus dels seus resultats

labels:
    - Expressions
    - Tipus

left:
    - "$a + $b"
    - "$e // $f"
    - "$c / $d"
    - "$a >= $b"
    - "$a == $b + $d == $c"
    - "'$d' + '$c'"
    
right:
    - "int"
    - "int"
    - "float"
    - "bool"
    - "bool"
    - "str"
   