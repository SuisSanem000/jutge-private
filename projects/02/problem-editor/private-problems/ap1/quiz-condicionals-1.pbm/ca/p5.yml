context: |

    Completa aquest programa perquè indiqui si un any és o no 
    de traspàs:

    ```python
    any = read(int) 
    if any R0 4 R1 0 and (any % 100 R2 0 or any % 400 R3 0):
        print(any, 'és any de traspàs')
    else:
        print(any, 'no és any de traspàs')
    ```


