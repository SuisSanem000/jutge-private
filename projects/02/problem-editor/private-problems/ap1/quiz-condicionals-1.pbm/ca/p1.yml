type: MultipleChoice

text: |

    Es vol llegir un nombre enter i escriure el seu valor absolut.
    Digues quins dels programes següents són correctes per aquesta especificació.


    Programa A:

    ```python
    num = read(int)
    if num:
        num = -num 
    print(num)
    ```

    Programa B:

    ```python
    num = read(int)
    if num <= 1:
        num = num 
    print(num)
    ```

    Programa C:

    ```python
    num = read(int)
    if 0 > num:
        num = num * -1
    print(num)
    ```

    Programa D:

    ```python
    num = read(int)
    if num < 0:
        num = -num
    print(num)
    ```

    Programa E:

    ```python
    num = read(int)
    if num <= 0:
        num = 0 - num
    print(num)
    ```

    Programa F:

    ```python
    num = read(int)
    if num == 0:
        print(0)
    elif num > 1:
        print(num)
    else:
        print(-num)
    ```


