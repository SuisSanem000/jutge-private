
type: FillIn

text: |

    Suposant que 
    `a = $a`,
    `b = $b`,
    `c = $c` i
    `d = $d`,
    digueu quin és el resultat de les expressions de la dreta.

context: |

    `a + b > c - d` = R1

    `(a + b) * c > d or a - b < 0` = R2
    
    `a >= b and a >= b and a >= c` = R3

    `(b != c or b >= a) and (a < c or a == b) and True` = R4

    `not (c == d + a)` = R5



