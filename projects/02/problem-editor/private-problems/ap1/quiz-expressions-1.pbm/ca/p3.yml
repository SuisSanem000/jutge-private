
type: FillIn

text: |

    
    Suposant que 
    `x = $x`,
    `y = $y` i 
    `z = $z`,
    trieu quin és el resultat de les expressions de la dreta.

    Fixeu-vos que les condicions són booleanes i, per tant,
    la resposta ha de ser `False` o `True`.


context: |

    `x + y == y + z` = R1

    `x + y != y + z` = R2
    
    `x + y > y + z` = R3
    
    `x < y < z` = R4
    
    `x <= y <= z` = R5


