
type: MultipleChoice

text: |

    Marqueu les expressions que produiran un error al avaluar-se.

choices:
    -   text: "`$x * ($y + $z)`"
    -   text: "`$z // $y`"
    -   text: "`$z // ($y - $y)`"
        correct: true
    -   text: "`2 * $x % 0`"
        correct: true
    -   text: "`0 ** 0`"
    -   text: "`$x ** ($y // 2 + $z)`"
    -   text: "`0 // 0`"
        correct: true
