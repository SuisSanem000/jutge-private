
type: FillIn

text: |

    Suposant que 
    `a = $a`,
    `b = $b`,
    `c = $c` i
    `d = $d`,
    digueu quin és el resultat de les expressions de la dreta.

context: |

    `a + b * c - d` = R1

    `(a + b) * c - d` = R2
    
    `a // b + c // d` = R3

    `a - b % 3` = R4

    `- (c // d)` = R5



items:

