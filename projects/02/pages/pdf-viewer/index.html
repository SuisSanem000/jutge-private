<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Problem Viewer — Phase 02</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #111; }
    .controls { display: flex; gap: 0.75rem; align-items: center; margin: 1rem 0; flex-wrap: wrap; }
    button { padding: 0.45rem 0.9rem; border: 1px solid #d0d7de; border-radius: 6px; background: #f6f8fa; cursor: pointer; font-weight: 600; }
    button.active { background: #0969da; color: #fff; border-color: #0969da; }
    iframe { width: 100%; height: 75vh; border: 1px solid #d0d7de; border-radius: 8px; }
  </style>
</head>
<body>
  <p><a href="../">&larr; Back to 02</a></p>
  <h1>PDF Problem Viewer</h1>
  <p>Minimal web interface to inspect Jutge problem PDFs (local server uses <code>Bun.serve</code> + <code>jtk make pdf</code>; static sample preview below).</p>

  <div class="controls">
    <button class="active" onclick="loadPdf('./samples/PRO2_Parcial_2026P.pdf', this)">Sample Exam PDF</button>
    <button onclick="loadPdf('./samples/PRO2_Parcial_2026P_Solucio.pdf', this)">Sample Solutions PDF</button>
  </div>

  <iframe id="viewer" src="./samples/PRO2_Parcial_2026P.pdf" title="Problem PDF Viewer"></iframe>

  <script>
    function loadPdf(src, btn) {
      document.getElementById('viewer').src = src;
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }
  </script>
</body>
</html>
